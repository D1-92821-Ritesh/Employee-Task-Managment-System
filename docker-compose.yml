version: '3.8'

services:
  # Infrastructure Services
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: manager
      MYSQL_DATABASE: employee_task_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - etms-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password_123
    ports:
      - "1433:1433"
    networks:
      - etms-network
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Password_123 -Q 'SELECT 1' -C" ]
      interval: 10s
      retries: 10
      start_period: 10s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-init
    volumes:
      - ./scripts/init-sqlserver.sh:/init-sqlserver.sh
    entrypoint: [ "/bin/bash", "/init-sqlserver.sh" ]
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password_123
    networks:
      - etms-network
    depends_on:
      sqlserver:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - etms-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 30s
      timeout: 30s
      retries: 3

  # Microservices
  discovery-service:
    build: ./services/discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - etms-network
    depends_on:
      - mysql

  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - etms-network
    depends_on:
      - discovery-service

  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/employee_task_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - etms-network
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_started

  user-service:
    build: ./services/user-service
    container_name: user-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/user_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - AUTH_SERVICE_URL=http://auth-service:8081
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - etms-network
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_started

  task-service:
    build: ./services/task-service
    container_name: task-service
    ports:
      - "5256:5256"
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=TaskServiceDb;User Id=sa;Password=Password_123;TrustServerCertificate=True;
      - RabbitMQ__HostName=rabbitmq
      - Eureka__Client__ServiceUrl=http://discovery-service:8761/eureka/
      - ASPNETCORE_URLS=http://+:5256
      - ASPNETCORE_URLS=http://+:5256
    networks:
      - etms-network
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_started
  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    environment:
      - EUREKA_HOST=discovery-service
      - EUREKA_PORT=8761
      # - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      # - EMAIL_HOST=smtp.ethereal.email
      # - EMAIL_PORT=587
      # - EMAIL_USER=faked_user
      # - EMAIL_PASS=faked_pass
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_USER=brahmankar.sid@gmail.com
      - EMAIL_PASS=feep mwdt ppic rtlk
      - EMAIL_FROM=brahmankar.sid@gmail.com
      - TEST_EMAIL_RECIPIENT=techshortcut29@gmail.com
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - INSTANCE_HOST=notification-service
      - INSTANCE_IP=notification-service
    networks:
      - etms-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_started

networks:
  etms-network:
    driver: bridge

volumes:
  mysql_data:
