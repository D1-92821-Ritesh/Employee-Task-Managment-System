# Server Port (Default is 8080, we change it to avoid conflict)
server.port=8082

# Application Name
spring.application.name=user-service

# Database Configuration (Connect to employee_db)
spring.datasource.url=jdbc:mysql://mysql:3306/user_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=manager

# JPA / Hibernate Config
# This updates the database schema automatically based on your Java entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Auth Service URL for inter-service communication
auth.service.url=${AUTH_SERVICE_URL:http://auth-service:8081}

# Eureka Client Config
eureka.client.serviceUrl.defaultZone=http://discovery-service:8761/eureka/
eureka.instance.prefer-ip-address=true
# eureka.instance.hostname=localhost
# eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}
